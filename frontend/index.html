<!DOCTYPE html>
<html>
<head>
  <title>AI Code Review Leaderboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 40px;
    }

    h1 {
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    input {
      padding: 10px;
      width: 70%;
      border-radius: 5px;
      border: none;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #1e293b;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🚀 AI Code Review Leaderboard</h1>

  <input id="model" placeholder="Enter model name (e.g. gpt-4o)" />
  <button onclick="run()">R Agent</button>

  <h2>🏆 Leaderboard</h2>
  <ul id="board"></ul>
</div>

<script src="app.js"></script>
</body>
</html>
